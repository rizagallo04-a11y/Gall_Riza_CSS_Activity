<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nested Box Model</title>
  <link rel="stylesheet" href="goal6.css">
</head>
<body>

  <div class="outer-box">
    <div class="middle-box">
      <p class="yellow-text">Yellow Text</p>
      <div class="inner-box">
        <p class="white-text">White Text</p>
      </div>

      <p class="yellow-text">Yellow Text</p>
      <div class="inner-box">
        <p class="white-text">White Text</p>
      </div>
    </div>
  </div>

</body>
</html>
